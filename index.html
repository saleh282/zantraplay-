<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZantraPlay</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="audio"></audio>

    <div class="app">
      <div class="sidebar">
        <div class="sidebar-header">
          <h3>🎵 ZantraPlay</h3>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search songs..." />
          </div>
        </div>
        <div class="song-list" id="songList"></div>
      </div>

      <div class="player" id="player">
        <div class="album-art-wrap">
          <div class="album-art-glow"></div>
          <img class="album-art" id="albumArt" src="" alt="Album Art" />
        </div>
        <div class="song-info">
          <div class="song-title" id="songTitle">—</div>
          <div class="song-artist" id="songArtist">—</div>
        </div>
        <div class="progress-wrap">
          <div class="time-labels">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
          </div>
          <input type="range" id="progressRange" value="0" min="0" step="1" />
        </div>
        <div class="volume-wrap">
          <i class="fa-solid fa-volume-low" id="muteBtn"></i>
          <input
            type="range"
            id="volumeRange"
            value="1"
            min="0"
            max="1"
            step=".01"
          />
          <span class="vol-val" id="volVal">100</span>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="backwardBtn">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button class="ctrl-btn" id="stopBtn">
            <i class="fa-solid fa-stop"></i>
          </button>
          <button class="play-btn" id="playPauseBtn">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>
          <button class="ctrl-btn" id="forwardBtn">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
